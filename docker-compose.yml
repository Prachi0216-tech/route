version: '3.8'

services:
  myroute-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myroute_transit_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=myroute_transit_production_secret_key_2026
    volumes:
      - ./server/data.json:/app/server/data.json
